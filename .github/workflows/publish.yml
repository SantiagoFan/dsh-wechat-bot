name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance；无需 NPM_TOKEN

jobs:
  publish:
    name: Publish @mindlink-ai/dsh-wechat-bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing / OIDC 需要 npm >= 11.5.1（Node 22 自带的 npm 可能更旧）
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::git tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}. Run 'npm version ${TAG}' first."
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

      # 前提：npmjs.com 包 Settings → Trusted Publisher 已登记
      #   Provider=GitHub Actions, Organization=SantiagoFan, Repository=dsh-wechat-bot, Workflow=publish.yml
      - name: Publish to npm (Trusted Publishing / OIDC)
        shell: bash
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::npm publish failed (exit ${code}): $(tail -n 1 /tmp/publish.log)"
            exit "$code"
          fi
