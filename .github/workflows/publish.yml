name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance；无需 NPM_TOKEN

jobs:
  publish:
    name: Publish @mindlink-ai/dsh-wechat-bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing / OIDC 需要 npm >= 11.5.1（Node 22 自带的 npm 可能更旧）
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          echo "registry: $(npm config get registry)"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::git tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}. Run 'npm version ${TAG}' first."
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

      # 前提：npmjs.com 包 Settings → Trusted Publisher 已登记
      #   Provider=GitHub Actions, Organization=SantiagoFan, Repository=dsh-wechat-bot,
      #   Workflow file name=publish.yml, Environment=留空
      # 若 OIDC 失败且仓库配置了 NPM_TOKEN secret，则自动回退到 token 发布（无 provenance）。
      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ -n "${NPM_TOKEN}" ]; then
            echo "OIDC publish failed; retrying with NPM_TOKEN (without provenance)"
            NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --access public 2>&1 | tee /tmp/publish.log
            code=${PIPESTATUS[0]}
          fi
          if [ "$code" -ne 0 ]; then
            echo "::group::npm publish log (tail)"
            tail -n 60 /tmp/publish.log
            echo "::endgroup::"
            # 把关键错误行以 annotation 暴露（公开仓库无需登录即可通过 check-run annotations 看到）
            grep -E "npm (error|ERR)" /tmp/publish.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$code"
          fi
