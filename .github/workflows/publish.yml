name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance；无需 NPM_TOKEN

jobs:
  publish:
    name: Publish @mindlink-ai/dsh-wechat-bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::git tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}. Run 'npm version ${TAG}' first."
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

      # 前提：在 npmjs.com 该包 Settings → Trusted Publisher 里登记
      #   Provider=GitHub Actions, Organization/Repository, Workflow file=publish.yml
      # 若尚未配置 Trusted Publisher，可临时改为 token 模式：
      #   env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public --provenance
